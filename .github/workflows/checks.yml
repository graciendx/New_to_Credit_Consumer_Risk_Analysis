name: Credit-risk workflow checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-notebook.txt
      - run: python scripts/fetch_data.py
      - run: python -m unittest discover -s tests -v
      - run: python -m ntc_risk --output /tmp/ntc-original
      - run: python scripts/verify_reproduction.py --actual /tmp/ntc-original
      - run: python -m ntc_risk --demo --output /tmp/ntc-demo
      - run: python scripts/execute_notebook.py --output /tmp/ntc-executed.ipynb
